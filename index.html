<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suggar Brown | Experiencias Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Polyfill process.env for browser compatibility to prevent crashes
      window.process = {
        env: {
          NODE_ENV: 'production',
          API_KEY: '' 
        }
      };

      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
              display: ['"Anton"', 'sans-serif'],
            },
            colors: {
              brand: {
                gold: '#FFC107', 
                goldDim: '#B8860B', 
                dark: '#0A0A0A', 
                charcoal: '#1A1A1A', 
                sand: '#F5F0EB',
                blue: '#2B4C6F'
              }
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            },
            animation: {
              'pulse-slow': 'pulse 10s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar { width: 8px; background: #0A0A0A; }
      ::-webkit-scrollbar-track { background: #1A1A1A; }
      ::-webkit-scrollbar-thumb { background: #FFC107; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
      .text-outline { -webkit-text-stroke: 1px rgba(255,255,255,0.3); color: transparent; }
    </style>
